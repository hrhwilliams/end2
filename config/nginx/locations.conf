# Routes shared by nginx.conf (TLS, behind the tunnel) and local.conf (plain HTTP).

# Upstreams go through variables so Docker DNS resolves them per request: nginx starts
# (and serves 502s) even when a service is down, instead of exiting at boot.
resolver 127.0.0.11 valid=30s;
set $frontend http://frontend:8081;
set $backend http://backend:8080;
set $anvil http://anvil:8545;

location / {
  gzip on;

  otel_span_name "$request_method $uri";
  proxy_pass $frontend;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /api {
  otel_span_name "$request_method $uri";
  proxy_pass $backend;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # WebSocket support
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
}

location /net {
  otel_span_name "$request_method $uri";
  proxy_pass $anvil;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # WebSocket support
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  # CORS for viem
  add_header 'Access-Control-Allow-Origin' 'https://chat.fiatlux.dev' always;
  add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
  add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
}

# /comet/<n>/ reaches validator n's RPC so the web client can read keys without the backend.
location ~ ^/comet/([0-3])/(.*)$ {
  otel_span_name "$request_method $uri";
  proxy_pass http://node$1:26657/$2$is_args$args;

  add_header 'Access-Control-Allow-Origin' 'https://chat.fiatlux.dev' always;
  add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
  add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
}
